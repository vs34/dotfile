# Example windowrule v1
windowrule = opacity 0.9 override 0.5 override, ^($menu)$
# Example windowrule v2
# windowrulev2 = float,class:(kitty),title:(kitty)
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrulev2 = nomaximizerequest, class:.* # You'll probably like this.
windowrulev2 = opacity 1 override 0.7 override, class:.*
windowrule = opacity 0.9 override 0.6 override, ^(kitty)$
# windowrulev2 = float,class:^(kitty-dropterm)$
# windowrule = noblur, ^(kitty-dropterm)$
# windowrule = xray 0, ^(kitty-dropterm)$

windowrule = float, pavucontrol
windowrule=size 25% 30%,pavucontrol
windowrule=move 1420 706 ,pavucontrol
windowrule = opacity 0.7 override 0.5 override, pavucontrol
windowrule = xray 1, pavucontrol

$dropterm=kitty-dropdown


windowrule = pin, $dropterm
# windowrule = forceinput, $dropterm
windowrule = workspace 1,$dropterm
windowrule = opacity 0.7 override 0.5 override,$dropterm
windowrule = float,$dropterm
windowrule = size 75% 40%,$dropterm
windowrule = move 12.5% 1088,$dropterm

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# ___.   .__            .___.__                      
# \_ |__ |__| ____    __| _/|__| ____    ____  ______
#  | __ \|  |/    \  / __ | |  |/    \  / ___\/  ___/
#  | \_\ \  |   |  \/ /_/ | |  |   |  \/ /_/  >___ \ 
#  |___  /__|___|  /\____ | |__|___|  /\___  /____  >
#      \/        \/      \/         \//_____/     \/ 
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod, O, exec, rofi -show emoji
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, nautilus .
# bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy && notify-send "ScreenShot capture" 
bind = , Print, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshot/$(date +'%Y-%m-%d_%H-%M-%S').jpg | wl-copy && notify-send "Screenshot captured"

# $screenshotarea = hyprctl keyword animation "fadeOut,0,0,default"; grimblast --notify copysave area; hyprctl keyword animation "fadeOut,1,4,default"
# bind = SUPER ALT, S, exec, $screenshotarea
# bind = , Print, exec, grimblast --notify --cursor copysave output
# bind = ALT, Print, exec, grimblast --notify --cursor copysave screen

bind = SUPER, T, exec, swaylock -f -c 000000
bind = $mainMod, F, togglefloating, 
bind = $mainMod SHIFT, F, fakefullscreen, 
bind = $mainMod ALT, F, fullscreen, 
bind = SUPER, C, exec, pgrep wofi >/dev/null 2>&1 && killall wofi && hyprctl dispatch focuscurrentorlast || cliphist list | wofi --dmenu  | cliphist decode | wl-copy

bind = $mainMod, A, exec, ~/.config/hypr/scripts/dropdown.sh
bind = $mainMod, V, exec, ~/.config/hypr/scripts/volcontr.sh
bind = , XF86MonBrightnessUp, exec,brightnessctl -d intel_backlight s 5%-
bind = , XF86MonBrightnessDown, exec,brightnessctl -d intel_backlight s +5%
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
# bind=SUPER,mouse_down,workspace,e-1
# bind = $mainMod, V, exec,pavucontrol --display=X 
bind = $mainMod, R, exec, pgrep -x wofi >/dev/null 2>&1 && killall wofi && hyprctl dispatch focuscurrentorlast || wofi --dmenu --show drun 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, Y, togglesplit, # dwindle
# bind = $mainMod, Tab, exec,rofi -show window # dwindle
# bind = SUPER,Tab,cyclenext,          # change focus to another window
# bind = ,exec,amixer -D pulse sset Master 5%+

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Resize focus window
bind = $mainMod ALT, H, resizeactive, 10 0
bind = $mainMod ALT, L, resizeactive, -10 0
bind = $mainMod ALT, K, resizeactive, 0 -10
bind = $mainMod ALT, J, resizeactive, 0 10

# Move focus window
bind = SUPER SHIFT, H, movewindoworgroup, l
bind = SUPER SHIFT, L, movewindoworgroup, r
bind = SUPER SHIFT, K, movewindoworgroup, u
bind = SUPER SHIFT, J, movewindoworgroup, d 

# Switch workspaces with mainMod + [0-9]

bind = $mainMod, B,  focuscurrentorlast

bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod ALT, 1, movetoworkspacesilent, 2
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# GROUP / TAB window config
bind = $mainMod SHIFT,G,togglegroup
bind = $mainMod ALT,G,lockgroups,toggle
bind = $mainMod ,G,lockactivegroup, toggle
bind = $mainMod G,TAB,changegroupactive
bind = $mainMod CTRL, 1, changegroupactive, 1
bind = $mainMod CTRL, 2, changegroupactive, 2
bind = $mainMod CTRL, 3, changegroupactive, 3
bind = $mainMod CTRL, 4, changegroupactive, 4
bind = $mainMod CTRL, 5, changegroupactive, 5
bind = $mainMod CTRL, 6, changegroupactive, 6
bind = $mainMod CTRL, 7, changegroupactive, 7
bind = $mainMod CTRL, 8, changegroupactive, 8
bind = $mainMod CTRL, 9, changegroupactive, 9
bind = $mainMod CTRL, 0, changegroupactive, 10

# pypr land bindings
# bind = $mainMod SHIFT, Z, exec, pypr zoom
# bind = $mainMod, LEFT, exec, pypr change_workspace +1
# bind = $mainMod, RIGHT, exec, pypr change_workspace -1
# bind = $mainMod SHIFT,A,exec,pypr toggle stb stb-logs
# bind = $mainMod,A,exec,pypr toggle term
# bind = $mainMod, V, exec,pypr toggle volume

# Example special workspace (scratchpad)
# animation=workspaces,1,8,default
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, D, togglespecialworkspace
bind = $mainMod SHIFT, D, movetoworkspace
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

