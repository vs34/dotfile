
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

autogenerated = 0 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,1920x1080,auto,1
monitor = HDMI-A-1,1920x1080,0x0,1,transform,0
# 0x0 to change place of monitor wrt inbuilt
# monitor=,preferred,auto,1
# monitor=,preferred,auto,1,mirror,DP-1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
# windowrulev2 = noanim,class:^(xwaylandvideobridge)$
# windowrulev2 = nofocus,class:^(xwaylandvideobridge)$
# windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$

#.-. .-. .-. .  . .-. . . 
#|  )|-| |-  |\/| | | |\| 
#`-' ` ' `-' '  ` `-' ' `
# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = hyprpaper
exec-once = swaync
# exec-once = cd ~/.config/Waybar && ./build/waybar 
exec-once = waybar
exec = hyprshade auto
# exec-once = pypr
exec-once = kitty --class=kitty-dropdown

# env = GTK_THEME,Arc-Dark
#
# set $gnome-schema org.gnome.desktop.interface
#
# exec_always {
#     gsettings set org.gnome.desktop.interface gtk-theme Arc-Dark
#     gsettings set $gnome-schema gtk-theme 'Arc-Dark'
#     gsettings set $gnome-schema icon-theme 'Adwaita'
#     gsettings set $gnome-schema cursor-theme 'Qogir'
#     gsettings set $gnome-schema font-name 'Adwaita'
# }
# exec-once = pavucontrol
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
# exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
$terminal = kitty
$fileManager = dolphin
$menu = wofi -show drun
$darkcolor1 = $(head -n 1 ~/.config/wallpaper/colors)
$darkcolor2 = $(exec, head -n 2 ~/.config/wallpaper/colors | tail -n 1)
$lightcolor1 = $(exec, head -n 3 ~/.config/wallpaper/colors | tail -n 2)
$lightcolor2 = $(exec, head -n 4 ~/.config/wallpaper/colors | tail -n 3)

# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
}

# █░█░█ █▀█ █▀█ █▄▀ █▀ █▀█ ▄▀█ █▀▀ █▀▀ █▀
# ▀▄▀▄▀ █▄█ █▀▄ █░█ ▄█ █▀▀ █▀█ █▄▄ ██▄ ▄█
# Sets alternating workspaces for dual monitor setup
# Main gets odd ws, secondary gets even ws
workspace = 1, monitor:eDP-1,default:true
workspace = 2, monitor:HDMI-A-1,default:true
workspace = 3, monitor:eDP-1,default:true
workspace = 4, monitor:HDMI-A-1,default:true
workspace = 5, monitor:eDP-1,default:true
workspace = 6, monitor:HDMI-A-1,default:true
workspace = 7, monitor:eDP-1,default:true
workspace = 8, monitor:HDMI-A-1,default:true
workspace = 9, monitor:eDP-1,default:true
workspace = 10, monitor:HDMI-A-1,default:true
# Set programs that you use

# Some default env vars.
env = XCURSOR_SIZE,10
env = GTK_THEME,Materia-dark-compact

# █▀▀ █▀█ █▀█ █░█ █▀█ █▀   ░░▄▀   ▀█▀ ▄▀█ █▄▄ █▀
# █▄█ █▀▄ █▄█ █▄█ █▀▀ ▄█   ▄▀░░   ░█░ █▀█ █▄█ ▄█
group{
    # col.border_active = 0x66ffffff
    col.border_locked_active = rgba(FAA334af) rgba(CC4D00ff) 90deg
    col.border_locked_inactive = rgba(750200ff) rgba(4E0000ff) 90deg 
    col.border_active = 0xff0000f0
    col.border_inactive = 0x66ff00ff
    groupbar{
        gradients = true
        height = 0
        font_size = 5
        text_color = 0x000000ff
        col.locked_active = rgba(FAA334af)
        col.locked_inactive = rgba(750200af) 
        col.active = 0xff6000f0
        col.inactive = 0x66ff00f0
    }
}
# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = .5 # -1.0 - 1.0, 0 means no modification.
}

# █▀▄ █▀▀ █▀▀ █▀█ █▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▄▀ ██▄ █▄▄ █▄█ █▀▄ █▀█ ░█░ █ █▄█ █░▀█
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 1
    gaps_out = 8
    border_size = 3
    # col.active_border = rgba($lightcolor1) rgba($lightcolor2) 90deg
    col.active_border = rgba(5d8834ff) rgba(5d8834ff) 90deg
    # col.active_border = rgba($(head -n 3 ~/.config/wallpaper/colors|tail -n 2)) rgba($(head -n 4 ~/.config/wallpaper/colors|tail -n 3)) 90deg
    col.inactive_border = rgba(750200ff) rgba(4E0000ff) 90deg 
    # col.inactive_border = rgba($(head -n 1 ~/.config/wallpaper/colors)) rgba($(head -n 2 ~/.config/wallpaper/colors|tail -n 1)) 90deg 

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}


decoration {

  rounding = 8
  # multisample_edges = true

  active_opacity = 1.0
  inactive_opacity = 1.0

  blur {
    enabled = true
    size = 10
    passes = 5
    new_optimizations = true
    xray = true
    ignore_opacity = true
  }

  drop_shadow = false
  shadow_ignore_window = true
  shadow_offset = 1 2
  shadow_range = 10
  shadow_render_power = 5
  col.shadow = 0x66404040

  # blurls = gtk-layer-shell
  blurls = waybar
  blurls = wofi
  blurls = lockscreen
}

# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█ █▀
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█ ▄█
animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.075, 0.82, 0.165, 1
    # animation = windows, 1, 7, myBezier
    # animation = windowsOut, 1, 7, default, popin 10%
    # animation = windowsOut, 1, 7, default, popin 10%
    # animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    # animation = fade, 1, 7, default
    # animation = workspaces, 1, 6, default
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,4,overshot,slide
    animation=border,1,10,default
    animation=fade,1,10,default
    animation=workspaces,0,1,myBezier,fade
}


dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

